<script>
(()=>{const store={};
store["app/settings"]={shop:"하라고지페",minWage:10320,payDay:10,night:false,holiday:false,breakDeduct:false,rates:{pension:4.75,health:3.595,care:13.14,employ:0.9},sales:{},staff:[{id:"owner",name:"사장",wage:12000,role:"owner",deduct:"none"},{id:"staffA",name:"직원A",wage:10320,role:"staff",deduct:"none"},{id:"staffB",name:"직원B",wage:10320,role:"staff",deduct:"none"},{id:"staffC",name:"직원C",wage:10320,role:"staff",deduct:"3.3"}]};
store["weeks/2026-10-11"]={start:"2026-10-11",days:[{shifts:[{who:"owner",t:"6.5-1"}],note:""},{shifts:[{who:"staffA",t:"6.5-10.5"}],note:""},{shifts:[{who:"staffB",t:"8-2"}],note:""},{shifts:[{who:"staffC",t:"6.5-10.5"}],note:""},{shifts:[{who:"staffA",t:"6.5-10.5"}],note:""},{shifts:[{who:"staffB",t:"8-2"}],note:""},{shifts:[],note:""}]};store["weeks/2026-10-18"]={start:"2026-10-18",days:[{shifts:[{who:"owner",t:"6.5-1"}],note:"화장실 청소"},{shifts:[{who:"staffA",t:"6.5-10.5"},{who:"owner",t:"9-1"}],note:""},{shifts:[{who:"owner",t:"6.5-1"},{who:"staffC",t:"6.5-10.5"}],note:"직원C 실습"},{shifts:[{who:"staffA",t:"6.5-10.5"},{who:"owner",t:"9-1"}],note:""},{shifts:[{who:"owner",t:"6.5-1"},{who:"staffC",t:"6.5-10.5"}],note:""},{shifts:[{who:"owner",t:"6.5-12.5"},{who:"staffA",t:"8-2"}],note:""},{shifts:[{who:"owner",t:"6.5-12.5"},{who:"staffB",t:"8-2"}],note:""}]};

const versions=Object.fromEntries(Object.keys(store).map(p=>[p,1]));window.__store=store;window.__writes=[];
const reply=(b,status=200)=>new Response(JSON.stringify(b),{status,headers:{'content-type':'application/json'}});
const realFetch=window.fetch;window.fetch=async(url,options={})=>{
 const path=new URL(url,location.href).pathname;
 if(!path.startsWith('/api/'))return realFetch(url,options);
 if(path==='/api/admin/login'){const b=JSON.parse(options.body);return b.password==='demo'?reply({token:'qa-token',expiresAt:new Date(Date.now()+14400000).toISOString()}):reply({error:'비밀번호를 확인해 주세요'},401);}
 if(options.headers?.Authorization!=='Bearer qa-token')return reply({error:'로그인 필요'},401);
 const doc=p=>({path:p,data:structuredClone(store[p]),version:versions[p],updatedAt:Date.now()});
 if(path==='/api/pay/state')return reply({docs:Object.keys(store).map(doc)});
 if(path==='/api/pay/doc'){const b=JSON.parse(options.body);if(b.ifVersion!==(versions[b.path]||0))return reply({current:store[b.path]?doc(b.path):null},409);store[b.path]=b.data;versions[b.path]=(versions[b.path]||0)+1;window.__writes.push(b.path);return reply({path:b.path,version:versions[b.path],updatedAt:Date.now()});}
 return reply({},404);
};})();
</script>
